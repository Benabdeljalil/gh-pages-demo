name: Docker React App
permissions:
  contents: write
on: 
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: node:24
    steps:
      - name: Code
        uses: actions/checkout@v7
      # - name: Install Node v24
      #   uses: actions/setup-node@v7 
      #   with:
      #     node-version: '24'
      - name: Install 
        run: npm install
      - name: Test 
        run: npm run test
  