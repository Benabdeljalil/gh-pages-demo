name: Artifact React App
permissions:
  contents: write
on: 
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code
        uses: actions/checkout@v7
      - name: Install Node v24
        uses: actions/setup-node@v7 
        with:
          node-version: '24'
      - name: Install 
        run: npm install
      - name: Test 
        run: npm run test > test.txt
      - name: Upload Test 
        uses: actions/upload-artifact@v7
        with:
          name: testing
          path: test.txt
  download-test:
    name: Download Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: DownloadTest
        uses: actions/download-artifact@v8
        with:
          name: testing
      - name: Print result 
        shell: bash
        run: |
          value=`cat test.txt`
          echo $value
 