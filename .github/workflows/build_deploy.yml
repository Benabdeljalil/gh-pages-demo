name: Test React App
on: 
  pull_request:
    types: 
      - opened
  workflow_dispatch:
  push:
    branches:
      - main
      - 'hotfix-*'
      - 'feature-*'
    paths-ignore:
      - '.github/workflows/*'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code
        uses: actions/checkout@v7
      - name: Install Node v24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install 
        run: npm install
      - name: Run tests 
        run: npm  test