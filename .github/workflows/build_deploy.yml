name: Deploy React App
permissions:
  contents: write
on: 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Code
        uses: actions/checkout@v7
      - name: Install Node v24
        uses: actions/setup-node@v7 
        with:
          node-version: '24'
      - name: Install 
        run: npm install
      - name: Test 
        run: npm run test
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Code
        uses: actions/checkout@v7
      - name: Install Node v24
        uses: actions/setup-node@v7 
        with:
          node-version: '24'
      - name: Install 
        run: npm install
      - name: Build 
        run: npm run build
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Code
        uses: actions/checkout@v7
      - name: Install Node v24
        uses: actions/setup-node@v7 
        with:
          node-version: '24'
      - name: Install 
        run: npm install
      - name: Build 
        run: npm run build
      - name: Deploy 
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages 
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
